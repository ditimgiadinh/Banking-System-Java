apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
    target:
      kind: Deployment

  - patch: |-
      - op: add
        path: /metadata/namespace
        value: banking-staging
    target:
      kind: Deployment

  - patch: |-
      - op: add
        path: /metadata/namespace
        value: banking-staging
    target:
      kind: Service

  - patch: |-
      - op: add
        path: /metadata/namespace
        value: banking-staging
    target:
      kind: ConfigMap

images:
  - name: your-registry/account-service
    newTag: staging-latest
  - name: your-registry/payment-service
    newTag: staging-latest
  - name: your-registry/fraud-detection-service
    newTag: staging-latest
  - name: your-registry/transaction-service
    newTag: staging-latest
  - name: your-registry/notification-service
    newTag: staging-latest
  - name: your-registry/api-gateway
    newTag: staging-latest