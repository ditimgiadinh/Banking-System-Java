server:
  port: 8082

spring:
  application:
    name: transaction-service

  datasource:
    # Old config (local)
    #url: jdbc:mysql://localhost:3306/transaction_db?createDatabaseIfNotExist=true
    #username: root
    #password: root
    #driver-class-name: com.mysql.cj.jdbc.Driver

    # New config (Kubernetes environment variables)
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?createDatabaseIfNotExist=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  kafka:
    # Old config (local)
    #bootstrap-servers: localhost:9092

    # New config (Kubernetes environment variables)
    bootstrap-servers: ${KAFKA_HOST}:${KAFKA_PORT}

    consumer:
      group-id: transaction-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring:
          json:
            trusted:
              packages: "*"
            use:
              type:
                headers: false
            value:
              default:
                type: java.util.HashMap
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

management:
  endpoints:
    web:
      exposure:
        include: health, info

account:
  service:
    # Old config (local)
    # url: http://localhost:8081
    #url: http://localhost:8081

    # New config (Kubernetes environment)
    url: http://account-service:8081